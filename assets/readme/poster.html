<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MARK poster</title>
  <style>
    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("../../node_modules/@fontsource/sora/files/sora-latin-500-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 800;
      font-display: block;
      src: url("../../node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2");
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 640px;
      overflow: hidden;
      background: #0b0d12;
    }

    .poster {
      position: relative;
      width: 1920px;
      height: 640px;
      overflow: hidden;
      background: #0b0d12;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% 45%;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #0b0d12 0%, #0b0d12 24%, rgba(11, 13, 18, 0.78) 42%, transparent 58%),
        linear-gradient(180deg, rgba(11, 13, 18, 0.18) 0%, transparent 22%, transparent 80%, rgba(11, 13, 18, 0.22) 100%);
    }

    .rim {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .type {
      position: absolute;
      left: 72px;
      top: 56px;
      width: 1120px;
      color: #f4f7fb;
    }

    .eyebrow {
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.18em;
      line-height: 1;
      color: #8ee0e3;
    }

    h1 {
      margin: 28px 0 0;
      font-family: "Sora", Inter, system-ui, sans-serif;
      font-weight: 800;
      font-size: 268px;
      letter-spacing: -0.06em;
      line-height: 0.84;
      color: #f4f7fb;
    }

    .principles {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      margin: 28px 0 0;
      font-family: "Sora", Inter, system-ui, sans-serif;
      font-weight: 500;
      font-size: 48px;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .c { color: #8ee0e3; }
    .b { color: #7aa2ff; }
    .v { color: #b28cff; }
    .dot { color: rgba(244, 247, 251, 0.4); }

    .stack {
      margin: 22px 0 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 30px;
      letter-spacing: 0.08em;
      color: #ffd788;
    }

    .sig {
      position: absolute;
      right: 72px;
      bottom: 36px;
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.16em;
      color: rgba(244, 247, 251, 0.45);
    }
  </style>
</head>
<body>
  <div class="poster">
    <img class="atmosphere" src="./poster-bg.jpg" alt="" />
    <div class="vignette"></div>
    <div class="type">
      <p class="eyebrow">01  /  PERSONAL SITE</p>
      <h1>MARK</h1>
      <p class="principles">
        <span class="c">Insight</span><span class="dot"> · </span><span class="b">Realism</span><span class="dot"> · </span><span class="v">Compounding</span>
      </p>
      <p class="stack">VuePress · Bun · EN/ZH</p>
    </div>
    <p class="sig">HANYANG CHU</p>
    <div class="rim"></div>
  </div>
</body>
</html>
