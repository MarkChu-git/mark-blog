<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MARK poster</title>
  <style>
    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("../../node_modules/@fontsource/sora/files/sora-latin-500-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "Sora";
      font-style: normal;
      font-weight: 800;
      font-display: block;
      src: url("../../node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2");
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 640px;
      overflow: hidden;
      background: #0b0d12;
    }

    .poster {
      position: relative;
      width: 1920px;
      height: 640px;
      overflow: hidden;
      background: #0b0d12;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% 45%;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #0b0d12 0%, #0b0d12 28%, rgba(11, 13, 18, 0.72) 46%, transparent 62%),
        linear-gradient(180deg, rgba(11, 13, 18, 0.22) 0%, transparent 28%, transparent 78%, rgba(11, 13, 18, 0.28) 100%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(186, 201, 227, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186, 201, 227, 0.055) 1px, transparent 1px);
      background-size: 118px 118px;
      mask-image: radial-gradient(ellipse 70% 80% at 22% 50%, #000 0%, transparent 72%);
      pointer-events: none;
    }

    .rim {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .type {
      position: absolute;
      left: 96px;
      top: 88px;
      width: 1024px;
      color: #f4f7fb;
    }

    .eyebrow {
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.28em;
      line-height: 1;
      color: rgba(142, 224, 227, 0.72);
      text-transform: none;
    }

    h1 {
      margin: 56px 0 0;
      font-family: "Sora", Inter, system-ui, sans-serif;
      font-weight: 800;
      font-size: 152px;
      letter-spacing: -0.055em;
      line-height: 0.86;
      color: #f4f7fb;
    }

    .principles {
      margin: 36px 0 0;
      font-family: "Sora", Inter, system-ui, sans-serif;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }

    .c { color: #8ee0e3; }
    .b { color: #7aa2ff; }
    .v { color: #b28cff; }
    .dot { color: rgba(244, 247, 251, 0.32); }

    .rule {
      width: 280px;
      height: 1px;
      margin: 20px 0 0;
      border: 0;
      background: linear-gradient(90deg, rgba(244, 247, 251, 0.55), rgba(244, 247, 251, 0));
    }

    .stack {
      margin: 16px 0 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: rgba(255, 215, 136, 0.88);
    }

    .sig {
      position: absolute;
      right: 96px;
      bottom: 36px;
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(244, 247, 251, 0.28);
    }
  </style>
</head>
<body>
  <div class="poster">
    <img class="atmosphere" src="./poster-bg.jpg" alt="" />
    <div class="vignette"></div>
    <div class="grid"></div>
    <div class="type">
      <p class="eyebrow">01  /  PERSONAL SITE</p>
      <h1>MARK</h1>
      <p class="principles">
        <span class="c">Insight</span><span class="dot"> · </span><span class="b">Realism</span><span class="dot"> · </span><span class="v">Compounding</span>
      </p>
      <hr class="rule" />
      <p class="stack">VuePress · Bun · EN/ZH</p>
    </div>
    <p class="sig">HANYANG CHU</p>
    <div class="rim"></div>
  </div>
</body>
</html>
